name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      # PySide6 needs a platform plugin even when no window is shown; run headless.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries (Qt headless)
        run: sudo apt-get update && sudo apt-get install -y libegl1

      - name: Install
        run: python -m pip install -e .[dev]

      - name: Lint
        run: |
          ruff check src tests integration
          ruff format --check src tests integration

      - name: Check requirement views are in sync
        # Fails if docs/requirements_views/ is stale vs the SRS or code Satisfies:
        # tags. Fix locally with: python tools/traceability_sync/generate_views.py
        run: python tools/traceability_sync/generate_views.py --check

      - name: Validate integration evidence mapping
        run: python -m integration.generate_coverage --check

      - name: Collect integration suite
        run: pytest integration/ --collect-only -q

      - name: Run target-free integration tiers
        run: pytest integration/ -m "visual or gui_integration"

      - name: Validate AI assets
        run: python tools/ai/validate.py

      - name: Test
        run: pytest
